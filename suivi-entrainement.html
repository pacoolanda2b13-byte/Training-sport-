<html lang="fr">

<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Carnet d'entraînement boxe</title>
<link rel="preconnect" href="https://fonts.googleapis.com">

<style id="css">
/* Plan : carnet de salle sur une colonne, pensé pour le téléphone. Encre + rouge gant de boxe, chiffres en condensé. */
:root{
  --bg:#EEF0F3;
  --surface:#FFFFFF;
  --ink:#15171D;
  --muted:#656A76;
  --line:#DDE0E6;
  --accent:#D3263A;
  --accent-soft:#FBE7EA;
  --good:#1D8F4E;
  --good-soft:#E3F4EA;
  --warn:#B97C00;
  --warn-soft:#FBF1DC;
  --font-display:"Barlow Condensed","Arial Narrow",sans-serif;
  --font-body:"Barlow",system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0F1116; --surface:#181B22; --ink:#ECEDF0; --muted:#9AA0AC; --line:#2A2E38;
    --accent:#F2475D; --accent-soft:#3A1A20; --good:#3FCB80; --good-soft:#163024;
    --warn:#E9B43C; --warn-soft:#3A2E12; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0F1116; --surface:#181B22; --ink:#ECEDF0; --muted:#9AA0AC; --line:#2A2E38;
  --accent:#F2475D; --accent-soft:#3A1A20; --good:#3FCB80; --good-soft:#163024;
  --warn:#E9B43C; --warn-soft:#3A2E12; color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:16px;line-height:1.45;-webkit-text-size-adjust:100%}
.wrap{max-width:720px;margin:0 auto;padding:16px 16px 120px;display:flex;flex-direction:column;gap:16px}
h1,h2,h3{font-family:var(--font-display);margin:0;text-wrap:balance;letter-spacing:.01em}
.num{font-variant-numeric:tabular-nums}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* En-tête */
.top{display:flex;flex-direction:column;gap:10px}
.top-row{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap}
.week{font-family:var(--font-display);font-weight:700;font-size:44px;line-height:.9;text-transform:uppercase}
.week small{font-size:20px;color:var(--muted);font-weight:600}
.eyebrow{font-family:var(--font-display);font-weight:600;font-size:14px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.pill{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:999px;font-size:13px;font-weight:600;background:var(--accent-soft);color:var(--accent)}
.pill.good{background:var(--good-soft);color:var(--good)}
.pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill.muted{background:var(--line);color:var(--muted)}
.bar{display:grid;grid-template-columns:repeat(12,1fr);gap:3px}
.bar span{height:8px;border-radius:2px;background:var(--line)}
.bar span.done{background:var(--ink)}
.bar span.now{background:var(--accent)}
.bar span.deload{opacity:.55}
.phase-note{font-size:14px;color:var(--muted)}

/* Onglets */
.tabs{display:flex;gap:4px;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:4px;position:sticky;top:8px;z-index:5}
.tabs button{flex:1;border:0;background:transparent;padding:9px 6px;border-radius:7px;font-family:var(--font-display);font-weight:600;font-size:17px;letter-spacing:.03em;text-transform:uppercase;color:var(--muted)}
.tabs button[aria-selected="true"]{background:var(--ink);color:var(--bg)}

.days{display:grid;grid-template-columns:repeat(6,1fr);gap:6px}
.days button{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:8px 2px 6px;display:flex;flex-direction:column;align-items:center;gap:2px}
.days b{font-family:var(--font-display);font-size:17px;text-transform:uppercase}
.days i{font-style:normal;font-size:11px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.days button[aria-pressed="true"]{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)}
.days .dot{width:6px;height:6px;border-radius:50%;background:transparent}
.days .dot.on{background:var(--good)}
.days .today b{color:var(--accent)}

.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px;display:flex;flex-direction:column;gap:12px}
.session-head{display:flex;justify-content:space-between;align-items:baseline;gap:8px;flex-wrap:wrap}
.session-head h2{font-size:30px;text-transform:uppercase}
.banner{border-radius:10px;padding:10px 12px;font-size:14px;background:var(--warn-soft);color:var(--ink);border-left:3px solid var(--warn)}
.banner.red{background:var(--accent-soft);border-left-color:var(--accent)}

/* Exercices */
.exo{display:flex;flex-direction:column;gap:8px;padding-top:12px;border-top:1px solid var(--line)}
.exo:first-of-type{border-top:0;padding-top:0}
.exo-head{display:flex;justify-content:space-between;gap:10px;align-items:baseline}
.exo-head h3{font-size:21px}
.target{font-family:var(--font-display);font-weight:600;font-size:18px;white-space:nowrap}
.hint{font-size:13px;color:var(--muted)}
.hint strong{color:var(--ink);font-weight:600}
.sets{display:flex;flex-direction:column;gap:6px}
.set{display:grid;grid-template-columns:28px 1fr 1fr 44px;gap:6px;align-items:center}
.set.one{grid-template-columns:28px 2fr 44px}
.set-n{font-family:var(--font-display);font-weight:600;color:var(--muted);text-align:center}
.field{position:relative}
.field input{width:100%;border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:9px 44px 9px 10px;font-variant-numeric:tabular-nums;font-size:17px}
.field span{position:absolute;right:10px;top:50%;transform:translateY(-50%);font-size:12px;color:var(--muted);pointer-events:none}
.check{height:42px;border-radius:8px;border:1px solid var(--line);background:var(--surface);font-size:18px;font-weight:700;color:var(--muted)}
.set.done .check{background:var(--good);border-color:var(--good);color:#fff}
.set.done input{border-color:var(--good)}

.rounds{display:flex;gap:6px;flex-wrap:wrap}
.round{min-width:44px;height:42px;border-radius:8px;border:1px solid var(--line);background:var(--bg);font-family:var(--font-display);font-weight:600;font-size:17px}
.round.done{background:var(--good);border-color:var(--good);color:#fff}

textarea{width:100%;min-height:70px;border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:10px;resize:vertical}
.btn{border:0;border-radius:10px;padding:14px 16px;background:var(--accent);color:#fff;font-family:var(--font-display);font-weight:700;font-size:20px;letter-spacing:.04em;text-transform:uppercase}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line);font-size:16px;padding:10px 14px}
.btn.small{font-size:15px;padding:8px 12px;border-radius:8px}
.btn[disabled]{opacity:.5;cursor:default}

/* Progression */
.grid2{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
@media (max-width:440px){.grid2{grid-template-columns:1fr}}
.test{border:1px solid var(--line);border-radius:10px;padding:12px;display:flex;flex-direction:column;gap:6px;border-left-width:4px}
.test.lvl0{border-left-color:var(--line)}
.test.lvl1{border-left-color:var(--warn)}
.test.lvl2{border-left-color:var(--good)}
.test-top{display:flex;justify-content:space-between;gap:6px;align-items:flex-start}
.test h3{font-size:18px}
.test .val{font-family:var(--font-display);font-weight:700;font-size:28px;line-height:1}
.test .goal{font-size:12px;color:var(--muted)}
.test form{display:flex;gap:6px}
.test form input{flex:1;min-width:0;border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:7px 9px;font-variant-numeric:tabular-nums}
select{border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:9px 10px;width:100%}
.chart svg{width:100%;height:auto;display:block}
.chart text{fill:var(--muted);font-size:17px;font-family:var(--font-body)}
.chart .lbl{fill:var(--ink);font-weight:600;font-size:18px}
.empty{color:var(--muted);font-size:14px;padding:18px 0;text-align:center}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{background:var(--bg);border-radius:8px;padding:10px}
.stat b{display:block;font-family:var(--font-display);font-size:26px;line-height:1}
.stat span{font-size:12px;color:var(--muted)}

/* Historique */
.hist{display:flex;flex-direction:column;gap:10px}
.hist-item{border:1px solid var(--line);border-radius:10px;padding:12px;display:flex;flex-direction:column;gap:4px}
.hist-item header{display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.hist-item h3{font-size:19px}
.hist-item p{margin:0;font-size:14px;color:var(--muted)}
.hist-item .del{border:0;background:transparent;color:var(--muted);font-size:13px;text-decoration:underline}
label.inline{display:flex;flex-direction:column;gap:4px;font-size:14px;color:var(--muted)}
label.inline input{border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:9px 10px;color:var(--ink)}

/* Minuteur et messages */
.timer{white-space:nowrap;position:fixed;left:50%;bottom:16px;transform:translateX(-50%);background:var(--ink);color:var(--bg);border-radius:999px;padding:10px 12px 10px 18px;display:flex;align-items:center;gap:12px;box-shadow:0 8px 24px rgba(0,0,0,.25);z-index:20;font-family:var(--font-display);font-size:20px;font-weight:600}
.timer[hidden]{display:none}
.timer button{white-space:nowrap;border:0;background:var(--accent);color:#fff;border-radius:999px;padding:6px 12px;font-family:var(--font-display);font-size:15px;font-weight:600}
.timer button.alt{background:transparent;color:var(--bg);border:1px solid currentColor}
.toast{position:fixed;left:50%;top:16px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;font-size:14px;z-index:30;max-width:calc(100% - 32px)}
.toast[hidden]{display:none}
.goalbar{height:10px;border-radius:999px;background:var(--line);overflow:hidden}
.goalbar span{display:block;height:100%;background:var(--good);border-radius:999px}
.rowform,.cardioform{display:flex;gap:8px;align-items:stretch;flex-wrap:wrap}
.rowform .field{flex:1;min-width:120px}
.cardioform select{flex:2;min-width:150px;width:auto}
.cardioform .field{flex:1;min-width:90px}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.lg-dot{width:8px;height:8px;border-radius:50%;border:1.5px solid var(--accent);display:inline-block}
.lg-line{width:16px;height:3px;background:var(--accent);display:inline-block;border-radius:2px}
.lg-dash{width:16px;border-top:2px dashed var(--muted);display:inline-block}
.cardio-dots{display:flex;gap:8px;align-items:center}
.cardio-dots span{width:28px;height:28px;border-radius:50%;border:2px solid var(--line)}
.cardio-dots span.on{background:var(--good);border-color:var(--good)}
.cardio-dots b{font-family:var(--font-display);font-size:22px;margin-left:6px}
.cardio-item{display:flex;justify-content:space-between;gap:8px;align-items:center;font-size:14px;border-bottom:1px solid var(--line);padding:6px 0}
.cardio-item .del{border:0;background:transparent;color:var(--muted);font-size:13px;text-decoration:underline}
.linkbtn{border:0;background:transparent;padding:0;color:var(--accent);font:inherit;font-size:13px;font-weight:600;text-decoration:underline;text-underline-offset:2px}
.rename{display:flex;flex-direction:column;gap:8px;background:var(--bg);border-radius:10px;padding:10px}
.rename input{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:9px 10px;color:var(--ink);font-size:16px}
.rename-btns{display:flex;gap:6px;flex-wrap:wrap}
.btn.dark{background:var(--ink);color:var(--bg)}
.swap{font-family:var(--font-body);font-size:11px;vertical-align:middle;padding:2px 8px}
.footnote{font-size:12px;color:var(--muted);text-align:center}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}
</style>
</head>

function phaseOf(w){
  if(w<=3) return {name:"Reprise",cls:"",note:"Charges légères, 3 séries maximum, garde 2 à 3 répétitions en réserve. Pliométrie en douceur."};

var timer = {left:0,id:null};

function ls(k,v){ try{ if(v===undefined) return localStorage.getItem(k); if(v===null) localStorage.removeItem(k); else localStorage.setItem(k,v); }catch(e){ return null; } }
function todayStr(){ var d=new Date(); return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate()); }
function pad(n){ return (n<10?"0":"")+n; }
function parseDate(s){ var p=s.split("-"); return new Date(+p[0],+p[1]-1,+p[2]); }
function weekOf(ds){ var diff=(parseDate(ds)-parseDate(state.startDate))/86400000; return Math.max(1,Math.floor(diff/7)+1); }
function fmtDate(ds){ var d=parseDate(ds); return d.toLocaleDateString("fr-FR",{weekday:"short",day:"numeric",month:"short"}); }
function shortDate(ds){ var p=ds.split("-"); return p[2]+"/"+p[1]; }
function defaultDay(){ var g=new Date().getDay(); return g>=1&&g<=6?DAY_ORDER[g-1]:"lun"; }
function esc(s){ return String(s==null?"":s).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c];}); }
function num(v){ if(v===""||v==null) return null; var n=parseFloat(String(v).replace(",",".")); return isNaN(n)?null:n; }
function fmtN(n){ return n==null?"–":(Math.round(n*10)/10).toString().replace(".",","); }

/* Si la sauvegarde partagée n'est pas disponible, on garde une copie dans ce navigateur */
function loadLocalFallback(){
  var raw=ls("ts-state"); if(!raw) return;
  try{ var loc=JSON.parse(raw); function cnt(x){return (x.sessions||[]).length+(x.tests||[]).length+(x.weights||[]).length+(x.cardio||[]).length;} if(loc && cnt(loc)>cnt(state)){ state=loc; state.weights=state.weights||[]; state.cardio=state.cardio||[]; state.goal=state.goal||{start:79,target:72,rate:0.5}; state.renames=state.renames||{}; } }catch(e){}
}

function getDraft(day){
  if(drafts[day]) return drafts[day];
  var raw=ls("ts-draft-"+day), d=null;
  if(raw){ try{ d=JSON.parse(raw); }catch(e){} }
  drafts[day]=d||{sets:{},rounds:{},note:""}; drafts[day].names=drafts[day].names||{};
  return drafts[day];
}
function saveDraft(day){ ls("ts-draft-"+day, JSON.stringify(drafts[day])); }

function baseName(exo){ return state.renames[exo.id]||exo.n; }
function nameNow(exo,d){ return (d&&d.names&&d.names[exo.id])||baseName(exo); }
function nameIn(s,exo){ return (s.names&&s.names[exo.id])||exo.n; }
function lastFor(exoId){
  for(var i=state.sessions.length-1;i>=0;i--){ var s=state.sessions[i]; if(s.sets&&s.sets[exoId]&&s.sets[exoId].length) return s; }
  return null;
}
function findExo(id){ for(var k in PROGRAM){ var ex=PROGRAM[k].exos||[]; for(var i=0;i<ex.length;i++) if(ex[i].id===id) return ex[i]; } return null; }
function setStr(exo,st){
  if(exo.a==="kg"||exo.a==="cm") return fmtN(st.a)+(exo.a==="cm"?" cm":"")+" × "+fmtN(st.b);
  if(exo.a==="lest") return (st.a?"+"+fmtN(st.a)+" kg × ":"")+fmtN(st.b)+" reps";
  return fmtN(st.b)+" "+(exo.b==="sec"?"s":exo.b);
}

/* ---------- Rendu ---------- */
var root=document.getElementById("root");
function render(){
  var today=todayStr(), w=weekOf(today), ph=phaseOf(w);
  var h='<div class="wrap">';
  h+='<header class="top"><div class="eyebrow">Carnet d\'entraînement · objectif boxe</div>';

  for(var i=1;i<=12;i++){ var c=i<w?"done":(i===w?"now":""); if(i===4||i===8) c+=" deload"; h+='<span class="'+c+'" title="Semaine '+i+'"></span>'; }
  h+='</div><div class="phase-note">'+esc(ph.note)+'</div></header>';

  h+='<nav class="tabs" role="tablist">';
  [["seance","Séance"],["poids","Poids"],["progres","Progrès"],["histo","Historique"]].forEach(function(t){
    h+='<button role="tab" data-tab="'+t[0]+'" aria-selected="'+(ui.tab===t[0])+'">'+t[1]+'</button>';

  h+='</div>';

function doneThisWeek(){
  var w=weekOf(todayStr()), done={};
  state.sessions.forEach(function(s){ if(weekOf(s.date)===w) done[s.day]=true; });
  return done;
}

function renderSession(w){
  var done=doneThisWeek(), todayKey=new Date().getDay()===0?null:DAY_ORDER[new Date().getDay()-1];
  var h='<div class="days">';
  DAY_ORDER.forEach(function(k){
    h+='<button type="button" data-day="'+k+'" aria-pressed="'+(ui.day===k)+'" class="'+(k===todayKey?"today":"")+'"><b>'+DAY_LABEL[k]+'</b><i>'+PROGRAM[k].short+'</i><span class="dot '+(done[k]?"on":"")+'"></span></button>';
  });

  if(new Date().getDay()===0) h+='<div class="banner">Aujourd\'hui c\'est dimanche : repos. Tu peux quand même consulter tes séances.</div>';

  if(day.type==="muscu"){
    if(ui.day==="ven"){ if(w<=3) h+='<div class="banner">Semaines de reprise : sauts et lancers à 70 % de ton intensité, pour habituer les tendons.</div>'; }
    day.exos.forEach(function(exo){
      var n=setsFor(exo,w), last=lastFor(exo.id), ds=d.sets[exo.id]||[];

      h+='<div class="exo" data-exo="'+exo.id+'"><div class="exo-head"><h3>'+esc(nm)+(today?' <span class="pill warn swap">Aujourd\'hui</span>':'')+'</h3><span class="target num">'+n+' × '+esc(exo.r)+'</span></div>';
      if(ui.editing===exo.id){
        h+='<div class="rename"><label class="inline" for="rename-'+exo.id+'">Nouvel exercice<input id="rename-'+exo.id+'" value="'+esc(nm)+'" placeholder="Ex. : Pec deck"></label>';
        h+='<div class="rename-btns"><button type="button" class="btn small" data-act="rn-today">Juste aujourd\'hui</button><button type="button" class="btn small dark" data-act="rn-always">Toujours</button><button type="button" class="btn ghost small" data-act="rn-cancel">Annuler</button></div>';
        if(nm!==exo.n) h+='<button type="button" class="linkbtn" data-act="rn-reset">Revenir à « '+esc(exo.n)+' »</button>';
        h+='<div class="hint">« Juste aujourd\'hui » : la machine est prise, tu fais autre chose cette fois. « Toujours » : l\'exercice est remplacé pour les prochaines séances.</div></div>';
      }
      var hint=[];
      if(ui.editing!==exo.id) hint.unshift('<button type="button" class="linkbtn" data-act="rename">Changer d\'exercice</button>');
      if(last) hint.push('Dernière fois ('+shortDate(last.date)+(nameIn(last,exo)!==nm?', '+esc(nameIn(last,exo)):'')+') : <strong>'+last.sets[exo.id].map(function(st){return esc(setStr(exo,st));}).join(", ")+'</strong>');
      if(exo.tip) hint.push(esc(exo.tip));
      hint.push('Repos '+(exo.rest>=60?Math.floor(exo.rest/60)+" min"+(exo.rest%60?" "+exo.rest%60:""):exo.rest+" s"));
      h+='<div class="hint">'+hint.join(" · ")+'</div><div class="sets">';
      for(var i=0;i<n;i++){
        var st=ds[i]||{}, ph=last&&last.sets[exo.id][i]?last.sets[exo.id][i]:(last?last.sets[exo.id][last.sets[exo.id].length-1]:{});
        h+='<div class="set '+(exo.a?"":"one")+(st.done?" done":"")+'" data-i="'+i+'"><span class="set-n">'+(i+1)+'</span>';
        if(exo.a){

        }
        var bl=exo.b==="sec"?"sec":exo.b;
        h+='<label class="field"><input id="in-'+exo.id+'-'+i+'-b" inputmode="numeric" data-f="b" value="'+esc(st.b==null?"":st.b)+'" placeholder="'+esc(ph.b==null?"":ph.b)+'" aria-label="'+esc(exo.n)+' série '+(i+1)+' '+bl+'"><span>'+bl+'</span></label>';
        h+='<button type="button" class="check" data-act="check" aria-label="Valider la série '+(i+1)+'">✓</button></div>';
      }
      h+='</div></div>';
    });
  } else {
    day.blocks.forEach(function(b){
      var r=d.rounds[b.id]||[];
      h+='<div class="exo" data-block="'+b.id+'"><div class="exo-head"><h3>'+esc(b.n)+'</h3><span class="target num">'+b.rounds+' rounds</span></div><div class="hint">'+esc(b.d)+'</div><div class="rounds">';
      for(var i=0;i<b.rounds;i++) h+='<button type="button" class="round '+(r[i]?"done":"")+'" data-act="round" data-i="'+i+'" aria-pressed="'+(!!r[i])+'">'+(i+1)+'</button>';
      h+='</div></div>';
    });
  }
  h+='<label class="inline" for="note">Ressenti, douleurs, remarques<textarea id="note" data-f="note" placeholder="Ex. : épaule droite un peu raide, bonne énergie">'+esc(d.note)+'</textarea></label>';
  h+='<button type="button" class="btn" data-act="save">Terminer et enregistrer la séance</button>';
  h+='<button type="button" class="btn ghost" data-act="reset">Effacer ce brouillon</button>';
  h+='</section>';
  return h;
}

function bestOf(exo,sets){
  var best=null;
  sets.forEach(function(st){
    var v = exo.a==="kg" ? (st.b>0?st.a:null) : st.b;
    if(v!=null && (best==null||v>best)) best=v;
  });
  return best;
}
function seriesFor(exoId){
  var exo=findExo(exoId), pts=[];
  state.sessions.forEach(function(s){ if(s.sets&&s.sets[exoId]){ var v=bestOf(exo,s.sets[exoId]); if(v!=null) pts.push({date:s.date,v:v}); } });
  return pts;
}
function testValue(t){
  var best=null, src=null;
  state.tests.forEach(function(x){ if(x.id===t.id){ if(best==null||(t.lower?x.v<best:x.v>best)){best=x.v;src=x.date;} } });
  if(t.auto){
    var exo=findExo(t.auto);
    state.sessions.forEach(function(s){ (s.sets&&s.sets[t.auto]||[]).forEach(function(st){
      var v=t.autoReps?st.b:(st.b>=t.autoMinReps?st.a:null);
      if(t.autoReps&&st.a) v=null; /* tractions lestées : on ne compte que le poids du corps */
      if(v!=null&&(best==null||v>best)){best=v;src=s.date;}
    }); });
  }
  return {v:best,date:src};
}
function levelOf(t,v){
  if(v==null) return 0;
  if(t.lower){ return v<=t.good?2:(v<=t.min?1:0); }
  return v>=t.good?2:(v>=t.min?1:0);
}
function fmtTest(t,v){
  if(v==null) return "–";
  if(t.time){ var m=Math.floor(v), s=Math.round((v-m)*60); return m+":"+pad(s); }
  return fmtN(v)+" "+t.unit;
}

function renderProgress(){
  var h='<section class="card"><div class="session-head"><h2>Prérequis</h2>';
  var lv=TESTS.map(function(t){return levelOf(t,testValue(t).v);});
  var okMin=lv.filter(function(x){return x>=1;}).length;
  h+='<span class="pill '+(okMin===TESTS.length?"good":"muted")+'">'+okMin+' / '+TESTS.length+' atteints</span></div>';
  h+='<div class="hint">Note tes tests en semaines 1, 4, 8 et 12. Soulevé de terre, développé couché et tractions se remplissent aussi tout seuls avec tes séances.</div><div class="grid2">';
  TESTS.forEach(function(t,i){
    var tv=testValue(t), l=lv[i];
    var pill=l===2?'<span class="pill good">Bon niveau</span>':(l===1?'<span class="pill warn">Minimum</span>':'<span class="pill muted">À atteindre</span>');
    var goalTxt=t.lower?("Minimum "+fmtTest(t,t.min)+" · bon "+fmtTest(t,t.good)):("Minimum "+t.min+" "+t.unit+" · bon "+t.good+" "+t.unit);
    h+='<div class="test lvl'+l+'"><div class="test-top"><h3>'+esc(t.n)+'</h3>'+pill+'</div>';
    h+='<div class="val num">'+fmtTest(t,tv.v)+'</div><div class="goal">'+goalTxt+(tv.date?' · le '+shortDate(tv.date):'')+'</div>';
    if(t.hint) h+='<div class="goal">'+esc(t.hint)+'</div>';
    h+='<form data-test="'+t.id+'"><input id="test-'+t.id+'" inputmode="decimal" placeholder="'+(t.time?"ex. 26:30":t.unit)+'" aria-label="Nouveau résultat '+esc(t.n)+'"><button class="btn small" type="submit">Noter</button></form></div>';
  });
  h+='</div></section>';

  /* Graphique */
  var opts=[]; DAY_ORDER.forEach(function(k){ (PROGRAM[k].exos||[]).forEach(function(e){ opts.push([k,e]); }); });
  var exo=findExo(ui.chartExo), pts=seriesFor(ui.chartExo);
  h+='<section class="card"><div class="session-head"><h2>Courbe de progression</h2></div>';
  h+='<label class="inline" for="chart-exo">Exercice<select id="chart-exo">';
  opts.forEach(function(o){ h+='<option value="'+o[1].id+'"'+(o[1].id===ui.chartExo?" selected":"")+'>'+DAY_LABEL[o[0]]+' · '+esc(baseName(o[1]))+'</option>'; });
  h+='</select></label>';
  var unit=exo.a==="kg"?"kg":(exo.b==="sec"?"s":exo.b);
  if(pts.length){
    var first=pts[0].v, lastV=pts[pts.length-1].v, max=Math.max.apply(null,pts.map(function(p){return p.v;}));
    h+='<div class="stats"><div class="stat"><b class="num">'+fmtN(lastV)+'</b><span>Dernière ('+unit+')</span></div><div class="stat"><b class="num">'+fmtN(max)+'</b><span>Record ('+unit+')</span></div><div class="stat"><b class="num">'+(lastV-first>=0?"+":"")+fmtN(lastV-first)+'</b><span>Depuis le début</span></div></div>';
  }
  h+='<div class="chart">'+chartSVG(pts,unit)+'</div>';
  h+='<div class="hint">'+(exo.a==="kg"?"Charge de ta meilleure série à chaque séance.":"Meilleure série à chaque séance.")+'</div></section>';
  return h;
}

function chartSVG(pts,unit){
  if(pts.length<2) return '<div class="empty">'+(pts.length?"Encore une séance avec cet exercice et ta courbe apparaît.":"Pas encore de séance enregistrée avec cet exercice.")+'</div>';
  var W=640,H=250,L=56,R=22,T=22,B=30;
  var vs=pts.map(function(p){return p.v;}), lo=Math.min.apply(null,vs), hi=Math.max.apply(null,vs);
  if(hi===lo){ hi+=5; lo=Math.max(0,lo-5); }
  var step=niceStep((hi-lo)/4); lo=Math.floor(lo/step)*step; hi=Math.ceil(hi/step)*step;
  function x(i){ return L+(W-L-R)*(i/(pts.length-1)); }
  function y(v){ return T+(H-T-B)*(1-(v-lo)/(hi-lo)); }
  var s='<svg viewBox="0 0 '+W+' '+H+'" role="img" aria-label="Progression en '+unit+'">';
  for(var g=lo; g<=hi+1e-9; g+=step){ s+='<line x1="'+L+'" x2="'+(W-R)+'" y1="'+y(g)+'" y2="'+y(g)+'" stroke="var(--line)" stroke-width="1"/><text x="'+(L-8)+'" y="'+(y(g)+4)+'" text-anchor="end">'+fmtN(g)+'</text>'; }
  var line=pts.map(function(p,i){return x(i).toFixed(1)+","+y(p.v).toFixed(1);}).join(" ");
  s+='<polygon points="'+x(0)+','+(H-B)+' '+line+' '+x(pts.length-1)+','+(H-B)+'" fill="var(--accent)" opacity=".12"/>';
  s+='<polyline points="'+line+'" fill="none" stroke="var(--accent)" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>';
  pts.forEach(function(p,i){ var last=i===pts.length-1; s+='<circle cx="'+x(i)+'" cy="'+y(p.v)+'" r="'+(last?5:3)+'" fill="'+(last?"var(--accent)":"var(--surface)")+'" stroke="var(--accent)" stroke-width="2"/>'; });
  var lx=x(pts.length-1), ly=y(pts[pts.length-1].v);
  s+='<text class="lbl" x="'+(lx-8)+'" y="'+(ly-10)+'" text-anchor="end">'+fmtN(pts[pts.length-1].v)+' '+unit+'</text>';
  s+='<text x="'+L+'" y="'+(H-8)+'">'+shortDate(pts[0].date)+'</text><text x="'+(W-R)+'" y="'+(H-8)+'" text-anchor="end">'+shortDate(pts[pts.length-1].date)+'</text>';
  return s+'</svg>';
}
function niceStep(r){ if(r<=0) return 1; var p=Math.pow(10,Math.floor(Math.log10(r))), f=r/p; return (f<=1?1:f<=2?2:f<=2.5?2.5:f<=5?5:10)*p; }


/* ---------- Poids et cardio ---------- */
var CARDIO_TYPES=["Vélo","Rameur","Marche rapide en pente","Footing","Corde à sauter","Autre"];
function dayNum(ds){ return Math.round(parseDate(ds).getTime()/86400000); }
function addDays(ds,n){ var d=parseDate(ds); d.setDate(d.getDate()+n); return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate()); }
function sortedWeights(){ return state.weights.slice().sort(function(a,b){return a.date<b.date?-1:1;}); }
function avgAround(ws,ds){ /* moyenne des 7 jours qui finissent à ds */
  var e=dayNum(ds), xs=ws.filter(function(w){ var n=dayNum(w.date); return n<=e && n>e-7; });
  if(!xs.length) return null; return xs.reduce(function(t,w){return t+w.v;},0)/xs.length;
}
function expectedAt(ds){
  var g=state.goal, weeks=(dayNum(ds)-dayNum(state.startDate))/7;
  return Math.max(g.target, g.start-g.rate*Math.max(0,weeks));
}
function weekStart(ds){ var d=parseDate(ds), g=(d.getDay()+6)%7; return addDays(ds,-g); }
function renderWeight(){
  var g=state.goal, ws=sortedWeights(), today=todayStr();
  var last=ws.length?ws[ws.length-1]:null, avg=last?avgAround(ws,last.date):null;
  var cur=avg!=null?avg:g.start, lost=g.start-cur, left=Math.max(0,cur-g.target);
  var pct=Math.max(0,Math.min(100,(lost/(g.start-g.target))*100));
  var h='<section class="card"><div class="session-head"><h2>Poids</h2>';
  var exp=expectedAt(last?last.date:today), diff=cur-exp;
  if(!last) h+='<span class="pill muted">Première pesée à faire</span>';
  else if(cur<=g.target) h+='<span class="pill good">Objectif atteint</span>';
  else if(diff<=0.3) h+='<span class="pill good">Dans les temps</span>';
  else h+='<span class="pill warn">'+fmtN(diff)+' kg au-dessus du rythme</span>';
  h+='</div>';
  h+='<div class="stats"><div class="stat"><b class="num">'+fmtN(cur)+'</b><span>Moyenne 7 jours (kg)</span></div><div class="stat"><b class="num">'+(lost>=0?"−":"+")+fmtN(Math.abs(lost))+'</b><span>Depuis '+fmtN(g.start)+' kg</span></div><div class="stat"><b class="num">'+fmtN(left)+'</b><span>Restants jusqu\'à '+fmtN(g.target)+' kg</span></div></div>';
  h+='<div class="goalbar" aria-label="'+Math.round(pct)+' % de l\'objectif"><span style="width:'+pct.toFixed(1)+'%"></span></div>';
  h+='<div class="hint">'+etaText(ws)+'</div>';
  var todayW=ws.filter(function(w){return w.date===today;})[0];
  h+='<form class="rowform" data-form="weight"><label class="field"><input id="weight-in" inputmode="decimal" placeholder="'+(last?esc(String(last.v).replace(".",",")):"79")+'" aria-label="Poids du jour en kg" value="'+(todayW?esc(String(todayW.v).replace(".",",")):"")+'"><span>kg</span></label><button class="btn small" type="submit">'+(todayW?"Corriger":"Noter")+' le poids du jour</button></form>';
  h+='<div class="hint">Pèse-toi 2 à 3 fois par semaine, le matin à jeun. Seule la moyenne compte.</div>';
  h+='<div class="chart">'+weightSVG(ws)+'</div>';
  h+='<div class="legend"><span><i class="lg-dot"></i>Pesées</span><span><i class="lg-line"></i>Moyenne 7 jours</span><span><i class="lg-dash"></i>Rythme visé (−'+fmtN(g.rate)+' kg/sem.)</span></div>';
  h+='</section>';

  /* Cardio */
  var ws0=weekStart(today), wk=state.cardio.filter(function(c){return c.date>=ws0;});
  var mins=wk.reduce(function(t,c){return t+(c.min||0);},0);
  h+='<section class="card"><div class="session-head"><h2>Cardio de la semaine</h2><span class="pill '+(wk.length>=2?"good":"muted")+'">'+wk.length+' / 3 séances</span></div>';
  h+='<div class="cardio-dots">'; for(var i=0;i<3;i++) h+='<span class="'+(i<wk.length?"on":"")+'"></span>'; h+='<b class="num">'+mins+' min</b></div>';
  h+='<div class="hint">Objectif : 2 à 3 séances de 30 à 40 min à allure facile (tu dois pouvoir parler). En plus : 8 000 à 10 000 pas par jour.</div>';
  h+='<form class="cardioform" data-form="cardio"><select id="cardio-type" aria-label="Type de cardio">'+CARDIO_TYPES.map(function(t){return '<option>'+esc(t)+'</option>';}).join("")+'</select><label class="field"><input id="cardio-min" inputmode="numeric" placeholder="30" aria-label="Durée en minutes"><span>min</span></label><button class="btn small" type="submit">Ajouter</button></form>';
  var recent=state.cardio.slice().sort(function(a,b){return a.date<b.date?1:-1;}).slice(0,8);
  if(recent.length){
    h+='<div class="hist">';
    recent.forEach(function(c){ h+='<div class="cardio-item"><span>'+fmtDate(c.date)+' · <strong>'+esc(c.type)+'</strong> · '+c.min+' min</span><button type="button" class="del" data-act="delcardio" data-id="'+esc(c.id)+'">Supprimer</button></div>'; });
    h+='</div>';
  } else h+='<div class="empty">Aucune séance de cardio notée pour l\'instant.</div>';
  h+='</section>';
  return h;
}
function etaText(ws){
  var g=state.goal;
  var targetDate=addDays(state.startDate,Math.ceil((g.start-g.target)/g.rate*7));
  var base='Au rythme de '+fmtN(g.rate)+' kg par semaine, tu atteins '+fmtN(g.target)+' kg vers le '+fmtDate(targetDate).replace(/\.$/,'')+'.';
  if(ws.length<2) return base;
  var first=ws[0], last=ws[ws.length-1], span=dayNum(last.date)-dayNum(first.date);
  if(span<14) return base+' Ta propre estimation apparaît après 2 semaines de pesées.';
  /* pente par régression linéaire sur les 4 dernières semaines */
  var e=dayNum(last.date), xs=ws.filter(function(w){return dayNum(w.date)>e-28;});
  var n=xs.length, mx=0,my=0; xs.forEach(function(w){mx+=dayNum(w.date);my+=w.v;}); mx/=n; my/=n;
  var num_=0,den=0; xs.forEach(function(w){var dx=dayNum(w.date)-mx; num_+=dx*(w.v-my); den+=dx*dx;});
  var slope=den?num_/den:0, perWeek=-slope*7, cur=avgAround(ws,last.date);
  if(perWeek<=0.05) return 'Ton poids ne baisse plus sur les 4 dernières semaines. Réduis un peu ce que tu manges ou ajoute une séance de cardio.';
  var days=Math.ceil((cur-g.target)/(perWeek/7));
  var txt='Ces 4 dernières semaines, tu perds '+fmtN(perWeek)+' kg par semaine. À ce rythme : '+fmtN(g.target)+' kg vers le '+fmtDate(addDays(last.date,Math.max(0,days))).replace(/\.$/,'')+'.';
  if(perWeek>1) txt+=' C\'est rapide : au-delà d\'1 kg par semaine, tu risques de perdre du muscle.';
  return txt;
}
function weightSVG(ws){
  var g=state.goal;
  if(ws.length<1) return '<div class="empty">Note ta première pesée pour voir la courbe.</div>';
  var W=640,H=260,L=52,R=16,T=16,B=30;
  var d0=Math.min(dayNum(state.startDate),dayNum(ws[0].date));
  var dEnd=Math.max(dayNum(ws[ws.length-1].date)+7, d0+28);
  var vals=ws.map(function(w){return w.v;}).concat([g.target,expectedAt(addDays(state.startDate,0))]);
  var lo=Math.floor(Math.min.apply(null,vals)-0.5), hi=Math.ceil(Math.max.apply(null,vals)+0.5);
  function x(dn){ return L+(W-L-R)*((dn-d0)/(dEnd-d0)); }
  function y(v){ return T+(H-T-B)*(1-(v-lo)/(hi-lo)); }
  var s='<svg viewBox="0 0 '+W+' '+H+'" role="img" aria-label="Courbe de poids">';
  var step=niceStep((hi-lo)/4);
  for(var gv=Math.ceil(lo/step)*step; gv<=hi+1e-9; gv+=step){ s+='<line x1="'+L+'" x2="'+(W-R)+'" y1="'+y(gv)+'" y2="'+y(gv)+'" stroke="var(--line)"/><text x="'+(L-6)+'" y="'+(y(gv)+4)+'" text-anchor="end">'+fmtN(gv)+'</text>'; }
  /* objectif */
  s+='<line x1="'+L+'" x2="'+(W-R)+'" y1="'+y(g.target)+'" y2="'+y(g.target)+'" stroke="var(--good)" stroke-width="1.5"/><text class="lbl" x="'+(W-R-4)+'" y="'+(y(g.target)-6)+'" text-anchor="end" style="fill:var(--good)">Objectif '+fmtN(g.target)+' kg</text>';
  /* rythme visé */
  var sd=dayNum(state.startDate), ed=Math.min(dEnd, sd+Math.ceil((g.start-g.target)/g.rate*7));
  s+='<line x1="'+x(Math.max(sd,d0))+'" y1="'+y(expectedAt(addDays(state.startDate,Math.max(0,d0-sd))))+'" x2="'+x(ed)+'" y2="'+y(expectedAt(addDays(state.startDate,ed-sd)))+'" stroke="var(--muted)" stroke-width="1.5" stroke-dasharray="5 5"/>';
  /* pesées */
  ws.forEach(function(w){ s+='<circle cx="'+x(dayNum(w.date)).toFixed(1)+'" cy="'+y(w.v).toFixed(1)+'" r="3" fill="var(--surface)" stroke="var(--accent)" stroke-width="1.5" opacity=".75"/>'; });
  /* moyenne 7 jours */
  if(ws.length>=2){
    var pts=ws.map(function(w){return x(dayNum(w.date)).toFixed(1)+","+y(avgAround(ws,w.date)).toFixed(1);}).join(" ");
    s+='<polyline points="'+pts+'" fill="none" stroke="var(--accent)" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>';
  }
  var lw=ws[ws.length-1], la=avgAround(ws,lw.date);
  s+='<circle cx="'+x(dayNum(lw.date))+'" cy="'+y(la)+'" r="5" fill="var(--accent)"/>';
  s+='<text class="lbl" x="'+(x(dayNum(lw.date))+8)+'" y="'+(y(la)-8)+'">'+fmtN(la)+' kg</text>';
  s+='<text x="'+L+'" y="'+(H-8)+'">'+shortDate(addDays(state.startDate,d0-sd))+'</text><text x="'+(W-R)+'" y="'+(H-8)+'" text-anchor="end">'+shortDate(addDays(state.startDate,dEnd-sd))+'</text>';
  return s+'</svg>';
}

function renderHistory(){
  var h='<section class="card"><div class="session-head"><h2>Historique</h2><span class="pill muted">'+state.sessions.length+' séance'+(state.sessions.length>1?"s":"")+'</span></div>';
  if(!state.sessions.length) h+='<div class="empty">Tes séances enregistrées apparaîtront ici.</div>';
  h+='<div class="hist">';
  state.sessions.slice().reverse().forEach(function(s){
    var day=PROGRAM[s.day], lines=[];
    if(day.type==="muscu"){
      day.exos.forEach(function(e){ if(s.sets[e.id]&&s.sets[e.id].length) lines.push('<strong>'+esc(nameIn(s,e))+'</strong> '+s.sets[e.id].map(function(st){return esc(setStr(e,st));}).join(", ")); });
    } else {
      day.blocks.forEach(function(b){ var n=(s.rounds&&s.rounds[b.id]||[]).filter(Boolean).length; lines.push('<strong>'+esc(b.n)+'</strong> '+n+' / '+b.rounds+' rounds'); });
    }
    h+='<article class="hist-item"><header><h3>'+fmtDate(s.date)+' · '+esc(day.name)+'</h3><span class="eyebrow num">S'+weekOf(s.date)+'</span></header>';
    h+=lines.map(function(l){return '<p>'+l+'</p>';}).join("");
    if(s.note) h+='<p><em>'+esc(s.note)+'</em></p>';
    h+='<div><button type="button" class="del" data-act="del" data-id="'+esc(s.id)+'">Supprimer cette séance</button></div></article>';
  });
  h+='</div></section>';
  h+='<section class="card"><h2>Réglages</h2><label class="inline" for="start">Début du programme (semaine 1)<input type="date" id="start" value="'+esc(state.startDate)+'"></label><label class="inline" for="goal-start">Poids de départ (kg)<input id="goal-start" inputmode="decimal" value="'+esc(String(state.goal.start).replace(".",","))+'"></label><label class="inline" for="goal-target">Poids objectif (kg)<input id="goal-target" inputmode="decimal" value="'+esc(String(state.goal.target).replace(".",","))+'"></label><button type="button" class="btn ghost" data-act="start">Enregistrer les réglages</button></section>';
  return h;
}

/* ---------- Sauvegarde ---------- */
function buildDoc(){
  var css=document.getElementById("css").textContent;
  var app=document.getElementById("app").textContent;
  var json=JSON.stringify(state).replace(/</g,"\\u003c");
  var head='<meta charset="utf-8">\n<meta name="viewport" content="width=device-width, initial-scale=1">\n<title>Carnet d\'entraînement boxe</title>\n<link rel="preconnect" href="https://fonts.googleapis.com">\n<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>\n<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">\n';
  return '<!DOCTYPE html>\n<html lang="fr">\n<head>\n'+head+'<style id="css">'+css+'</style>\n</head>\n<body>\n<div id="root"></div>\n<script type="application/json" id="state">'+json+'<\/script>\n<script id="app">'+app+'<\/script>\n</body>\n</html>\n';
}
var saving=false;
function persist(okMsg,onFail){
  if(saving) return Promise.resolve(false);
  saving=true;
  ls("ts-state",JSON.stringify(state));
  if(!art){ saving=false; toast(okMsg); render(); return Promise.resolve(true); }
  return art.publish(buildDoc()).then(function(){ saving=false; toast(okMsg); return true; }).catch(function(e){
    saving=false;
    var code=(e&&(e.code||e.name||e.message))||"";
    if(/conflict/i.test(code)){ toast("La page a été mise à jour ailleurs, elle se recharge."); }
    else if(/not_granted|not_writer/i.test(code)){ toast("Tu n'as pas le droit d'enregistrer sur cette page. Sauvegarde gardée dans ce navigateur."); }
    else { toast("Enregistrement impossible pour le moment. Ta séance est gardée dans ce navigateur, réessaie."); }
    if(onFail) onFail();
    render();
    return false;
  });
}
function toast(msg){
  var t=document.getElementById("toast"); if(!t||!msg) return;
  t.textContent=msg; t.hidden=false; clearTimeout(toast._t); toast._t=setTimeout(function(){t.hidden=true;},3200);
}

/* ---------- Minuteur ---------- */
function startTimer(sec){ timer.left=sec; clearInterval(timer.id); timer.id=setInterval(function(){ timer.left--; if(timer.left<=0){ clearInterval(timer.id); timer.left=0; } updateTimer(); },1000); updateTimer(); }
function updateTimer(){
  var el=document.getElementById("timer"); if(!el) return;
  el.hidden=timer.left<=0;
  var m=Math.floor(timer.left/60), s=timer.left%60;
  var l=document.getElementById("timer-left"); if(l) l.textContent=m+":"+pad(s);
}

/* ---------- Événements ---------- */
root.addEventListener("click",function(ev){
  var b=ev.target.closest("button"); if(!b) return;
  if(b.dataset.tab){ ui.tab=b.dataset.tab; render(); return; }
  if(b.dataset.day){ ui.day=b.dataset.day; render(); return; }
  var act=b.dataset.act, d=getDraft(ui.day);
  if(act==="check"){
    var row=b.closest(".set"), exoEl=b.closest(".exo"), id=exoEl.dataset.exo, i=+row.dataset.i, exo=findExo(id);
    d.sets[id]=d.sets[id]||[]; var st=d.sets[id][i]=d.sets[id][i]||{};
    var ia=row.querySelector('[data-f="a"]'), ib=row.querySelector('[data-f="b"]');
    if(!st.done){
      if(ia&&ia.value===""&&ia.placeholder!=="") { ia.value=ia.placeholder; }
      if(ib.value===""&&ib.placeholder!=="") { ib.value=ib.placeholder; }
      st.a=ia?num(ia.value):null; st.b=num(ib.value);
      if(st.b==null){ ib.focus(); toast("Indique d'abord tes "+(exo.b==="sec"?"secondes":exo.b)+"."); return; }
      st.done=true; row.classList.add("done"); startTimer(exo.rest);
    } else { st.done=false; row.classList.remove("done"); }
    saveDraft(ui.day); return;
  }
  if(act==="round"){
    var bid=b.closest(".exo").dataset.block, ri=+b.dataset.i;
    d.rounds[bid]=d.rounds[bid]||[]; d.rounds[bid][ri]=!d.rounds[bid][ri];
    b.classList.toggle("done",d.rounds[bid][ri]); b.setAttribute("aria-pressed",String(d.rounds[bid][ri])); saveDraft(ui.day); return;
  }
  if(act&&act.indexOf("rn")===0||act==="rename"){
    var ex=b.closest(".exo"), eid=ex&&ex.dataset.exo, eo=findExo(eid);
    if(act==="rename"){ ui.editing=eid; render(); var inp=document.getElementById("rename-"+eid); if(inp){ inp.focus(); inp.select(); } return; }
    if(act==="rn-cancel"){ ui.editing=null; render(); return; }
    var val=(document.getElementById("rename-"+eid)||{}).value; val=(val||"").trim();
    if(act==="rn-reset"){
      delete d.names[eid]; saveDraft(ui.day); ui.editing=null;
      if(state.renames[eid]){ var oldR=state.renames[eid]; delete state.renames[eid]; persist("Exercice d'origine remis.",function(){ state.renames[eid]=oldR; }); } else render();
      return;
    }
    if(!val){ toast("Écris le nom de l'exercice."); return; }
    if(act==="rn-today"){ if(val===baseName(eo)) delete d.names[eid]; else d.names[eid]=val; saveDraft(ui.day); ui.editing=null; render(); toast("Remplacé pour cette séance."); return; }
    if(act==="rn-always"){
      delete d.names[eid]; saveDraft(ui.day); ui.editing=null;
      var prevR=state.renames[eid];
      if(val===eo.n) delete state.renames[eid]; else state.renames[eid]=val;
      persist("Exercice remplacé pour les prochaines séances.",function(){ if(prevR) state.renames[eid]=prevR; else delete state.renames[eid]; }); return;
    }
  }
  if(act==="timer-add"){ startTimer(timer.left+30); return; }
  if(act==="timer-stop"){ timer.left=0; clearInterval(timer.id); updateTimer(); return; }
  if(act==="reset"){ drafts[ui.day]={sets:{},rounds:{},note:"",names:{}}; ls("ts-draft-"+ui.day,null); render(); return; }
  if(act==="save"){ saveSession(); return; }
  if(act==="del"){
    if(b.dataset.confirm!=="1"){ b.dataset.confirm="1"; b.textContent="Confirmer la suppression"; return; }
    var keep=state.sessions; state.sessions=state.sessions.filter(function(s){return s.id!==b.dataset.id;});
    persist("Séance supprimée.",function(){ state.sessions=keep; }); return;
  }
  if(act==="delcardio"){
    if(b.dataset.confirm!=="1"){ b.dataset.confirm="1"; b.textContent="Confirmer"; return; }
    var keepC=state.cardio; state.cardio=state.cardio.filter(function(c){return c.id!==b.dataset.id;});
    persist("Séance de cardio supprimée.",function(){ state.cardio=keepC; }); return;
  }
  if(act==="start"){
    var v=document.getElementById("start").value; if(!v) return;
    var gs=num(document.getElementById("goal-start").value), gt=num(document.getElementById("goal-target").value);
    if(gs==null||gt==null||gt>=gs){ toast("Le poids objectif doit être plus bas que le poids de départ."); return; }
    var old=state.startDate, oldG=JSON.stringify(state.goal);
    state.startDate=v; state.goal.start=gs; state.goal.target=gt;
    persist("Réglages enregistrés.",function(){ state.startDate=old; state.goal=JSON.parse(oldG); }); return;
  }
});
root.addEventListener("input",function(ev){
  var t=ev.target, f=t.dataset&&t.dataset.f; if(!f) return;
  var d=getDraft(ui.day);
  if(f==="note"){ d.note=t.value; saveDraft(ui.day); return; }
  var row=t.closest(".set"), id=t.closest(".exo").dataset.exo, i=+row.dataset.i;
  d.sets[id]=d.sets[id]||[]; var st=d.sets[id][i]=d.sets[id][i]||{};
  st[f]=num(t.value); saveDraft(ui.day);
});
root.addEventListener("change",function(ev){ if(ev.target.id==="chart-exo"){ ui.chartExo=ev.target.value; render(); } });
root.addEventListener("submit",function(ev){
  ev.preventDefault();
  var form=ev.target.dataset.form;
  if(form==="weight"){
    var wv=num(document.getElementById("weight-in").value);
    if(wv==null||wv<30||wv>250){ toast("Entre ton poids en kg, par exemple 78,4."); return; }
    var td=todayStr(), prev=state.weights.slice();
    state.weights=state.weights.filter(function(w){return w.date!==td;}); state.weights.push({date:td,v:wv});
    persist("Poids noté.",function(){ state.weights=prev; }); return;
  }
  if(form==="cardio"){
    var mn=num(document.getElementById("cardio-min").value), ty=document.getElementById("cardio-type").value;
    if(mn==null||mn<=0){ toast("Indique la durée en minutes."); return; }
    state.cardio.push({id:Date.now().toString(36),date:todayStr(),type:ty,min:Math.round(mn)});
    persist("Cardio ajouté.",function(){ state.cardio.pop(); }); return;
  }
  var f=ev.target, id=f.dataset.test; if(!id) return;
  var t=TESTS.filter(function(x){return x.id===id;})[0], raw=f.querySelector("input").value.trim(), v;
  if(t.time && raw.indexOf(":")>-1){ var p=raw.split(":"); v=(+p[0])+(+p[1]||0)/60; } else v=num(raw);
  if(v==null||isNaN(v)){ toast("Entre un nombre"+(t.time?" ou un temps comme 26:30":"")+"."); return; }
  state.tests.push({id:id,v:v,date:todayStr()});
  persist("Résultat noté.",function(){ state.tests.pop(); });
});

function saveSession(){
  var day=PROGRAM[ui.day], d=getDraft(ui.day), w=weekOf(todayStr());
  var s={id:Date.now().toString(36),date:todayStr(),day:ui.day,note:(d.note||"").trim()};
  if(day.type==="muscu"){
    s.sets={}; var any=false;
    day.exos.forEach(function(e){
      var arr=(d.sets[e.id]||[]).slice(0,setsFor(e,w)).filter(function(st){return st&&st.done&&st.b!=null;}).map(function(st){ var o={b:st.b}; if(st.a!=null) o.a=st.a; return o; });
      if(arr.length){ s.sets[e.id]=arr; any=true; var un=nameNow(e,d); if(un!==e.n){ s.names=s.names||{}; s.names[e.id]=un; } }
    });
    if(!any){ toast("Valide au moins une série avec ✓ avant d'enregistrer."); return; }
  } else {
    s.rounds={}; var n=0;
    day.blocks.forEach(function(b){ s.rounds[b.id]=(d.rounds[b.id]||[]).slice(0,b.rounds).map(Boolean); n+=s.rounds[b.id].filter(Boolean).length; });
    if(!n){ toast("Coche au moins un round avant d'enregistrer."); return; }
  }
  state.sessions.push(s);
  var backup=JSON.stringify(drafts[ui.day]), dayKey=ui.day;
  ls("ts-draft-"+dayKey,null); drafts[dayKey]={sets:{},rounds:{},note:"",names:{}};
  persist("Séance enregistrée. Bien joué !",function(){ state.sessions.pop(); drafts[dayKey]=JSON.parse(backup); ls("ts-draft-"+dayKey,backup); });
}

/* ---------- Démarrage ---------- */
render();
function getArtifact(){
  return new Promise(function(res){
    var tries=0;
    (function look(){
      if(window.claude && typeof window.claude.use==="function"){ Promise.resolve(window.claude.use("artifact")).then(res,function(){res(null);}); return; }
      if(++tries>30) return res(null);
      setTimeout(look,100);
    })();
  });
}
getArtifact().then(function(a){ art=a||null; }).catch(function(){ art=null; }).then(function(){
  artReady=true;
  if(!art) loadLocalFallback();
  render();
});
})();
</script>
